<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌词馆 · Lyrics Gallery</title>
    <style>
        /* ============ 全局基础样式 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-soft: #f5f5f7;
            --text: #1d1d1f;
            --text-dim: #86868b;
            --accent: #0071e3;
            --accent-soft: #e8f0fe;
            --card-bg: #ffffff;
            --card-border: #e8e8ed;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 18px 40px rgba(0, 0, 0, 0.12);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: var(--bg);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============ 顶部导航 ============ */
        header.site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 18px 6vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text);
            cursor: pointer;
        }

        .logo span {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 8px;
        }

        nav.site-nav ul {
            list-style: none;
            display: flex;
            gap: 28px;
        }

        nav.site-nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.25s;
            position: relative;
        }

        nav.site-nav a:hover {
            color: var(--accent);
        }

        nav.site-nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s;
        }

        nav.site-nav a:hover::after {
            width: 100%;
        }

        /* ============ 主体容器 ============ */
        main {
            position: relative;
            z-index: 5;
            padding: 0 6vw 60px;
        }

        /* ============ 首页英雄区 ============ */
        .hero {
            text-align: center;
            padding: 70px 0 50px;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 18px;
            color: var(--text);
        }

        .hero p {
            color: var(--text-dim);
            font-size: 1.05rem;
            max-width: 560px;
            margin: 0 auto;
        }

        .hero .stats {
            margin-top: 26px;
            display: inline-flex;
            gap: 36px;
            padding: 14px 30px;
            background: var(--bg-soft);
            border: 1px solid var(--card-border);
            border-radius: 999px;
        }

        .hero .stats div {
            text-align: center;
        }

        .hero .stats .num {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }

        .hero .stats .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* ============ 区块标题 ============ */
        .section-title {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 30px 0 26px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 22px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ============ 卡片网格 ============ */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 26px;
        }

        .song-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                        box-shadow 0.35s,
                        border-color 0.35s;
        }

        .song-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .card-cover {
            height: 180px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-cover::before {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            transition: transform 0.6s;
        }

        .song-card:hover .card-cover::before {
            transform: scale(1.12);
        }

        .card-cover .cover-char {
            position: relative;
            font-size: 3.4rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        .card-body {
            padding: 16px 18px 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-artist {
            color: var(--text-dim);
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-dim);
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        .card-meta .play-hint {
            color: var(--accent);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .song-card:hover .card-meta .play-hint {
            opacity: 1;
            transform: translateX(0);
        }

        /* ============ 歌词详情页 ============ */
        .lyrics-page {
            padding-top: 30px;
            animation: fadeIn 0.45s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.92rem;
            transition: background 0.25s, transform 0.25s, border-color 0.25s;
        }

        .back-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            transform: translateX(-3px);
        }

        .lyrics-header {
            display: flex;
            gap: 28px;
            margin: 30px 0 36px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .lyrics-cover {
            width: 200px;
            height: 200px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 6px 22px rgba(0, 0, 0, 0.25);
            box-shadow: var(--shadow-hover);
            flex-shrink: 0;
        }

        .lyrics-info h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
        }

        .lyrics-info .artist {
            font-size: 1.15rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .lyrics-info .album {
            color: var(--text-dim);
            font-size: 0.92rem;
        }

        .lyrics-content {
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px 40px;
            box-shadow: var(--shadow);
            white-space: pre-line;
            font-size: 1.05rem;
            line-height: 2.4;
            letter-spacing: 0.5px;
            color: var(--text);
        }

        .lyrics-content .lyric-line {
            transition: color 0.2s, transform 0.2s;
            padding: 2px 0;
        }

        .lyrics-content .lyric-line:hover {
            color: var(--accent);
            transform: translateX(6px);
        }

        /* ============ 页脚 ============ */
        footer.site-footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 30px 6vw 40px;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            header.site-header {
                padding: 18px 5vw;
            }

            nav.site-nav ul {
                gap: 18px;
            }

            .hero {
                padding: 44px 0 34px;
            }

            .hero .stats {
                gap: 22px;
                padding: 12px 22px;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .card-cover {
                height: 140px;
            }

            .card-cover .cover-char {
                font-size: 2.6rem;
            }

            .lyrics-cover {
                width: 140px;
                height: 140px;
                font-size: 3rem;
                border-radius: 18px;
            }

            .lyrics-content {
                padding: 24px 22px;
                font-size: 1rem;
                line-height: 2.2;
            }
        }

        @media (max-width: 480px) {
            nav.site-nav a {
                font-size: 0.85rem;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="site-header">
        <div class="logo" onclick="goHome()">歌词馆<span>Lyrics Gallery</span></div>
        <nav class="site-nav">
            <ul>
                <li><a href="#/" onclick="goHome()">首页</a></li>
                <li><a href="#/about">关于</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main id="app"></main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <p>© 2026 歌词馆 · 仅供学习交流使用，歌词版权归原作者所有</p>
    </footer>

    <script>
        /* ============ 歌曲数据 ============ */
        const songs = [

                year: "2000",
                cover: "linear-gradient(135deg, #667eea, #764ba2)",
                char: "钟",
                lyrics: `ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏ

也有苦衷 也不想送
寒风中 废墟烟囱
停止转动 一切落空
在人海中盲目跟从
别人的梦 全面放纵
恨没有用 疗伤止痛
不再感动 没有梦
痛不知轻重
泪水鲜红 全面放纵
恨自己真的没用情绪激动
一颗心到现在还在抽痛
还为分手前那句抱歉在感动
穿梭时间的画面的钟
从反方向 开始移动
回到当初爱你的时空
停格内容 不忠
所有回忆对着我进攻
我的伤口 被你拆封
誓言太沉重泪被纵容
脸上汹涌 失控
穿梭时间的画面的钟
从反方向 开始移动
回到当初爱你的时空
停格内容 不忠
所有回忆对着我进攻`
            },
             {
                id: "Duvet",
                title: "Duvet",
                artist: "Boa",
                album: "Twilight",
                year: "1998",
                cover: "linear-gradient(135deg, #667eea, #764ba2)",
                char: "D",
                lyrics: `
                And you don't seem to understand
A shame you seemed an honest man
And all the fears you hold so dear
Will turn to whisper in your ear
And you know what they say might hurt you
And you know that it means so much

I am falling

I have lost it all
And you don't seem the lying kind
A shame that I can read your mind
And all the things that I read there
Candlelit smile that we both share
And you know I don't mean to hurt you

I am falling

I am hurting
I have lost it all
I am losing
Help me to breathe
                `
            },
        ];

        /* ============ 路由渲染 ============ */
        const app = document.getElementById("app");

        // 渲染首页
        function renderHome() {
            const cardsHtml = songs.map(song => `
                <article class="song-card" onclick="location.hash = '#/song/' + '${song.id}'">
                    <div class="card-cover" style="background: ${song.cover};">
                        <span class="cover-char">${song.char}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${song.title}</div>
                        <div class="card-artist">${song.artist}</div>
                        <div class="card-meta">
                            <span>${song.year} · ${song.album}</span>
                            <span class="play-hint">查看歌词 →</span>
                        </div>
                    </div>
                </article>
            `).join("");

            app.innerHTML = `
                <section class="hero">
                    <h1>歌词馆</h1>
                    <p>收藏那些值得反复咀嚼的字句。点击任意卡片，进入一首歌的完整世界。</p>
                    <div class="stats">
                        <div><div class="num">${songs.length}</div><div class="label">SONGS</div></div>
                        <div><div class="num">${new Set(songs.map(s => s.artist)).size}</div><div class="label">ARTISTS</div></div>
                        <div><div class="num">8</div><div class="label">YEARS</div></div>
                    </div>
                </section>
                <h2 class="section-title">全部歌曲</h2>
                <div class="cards-grid">${cardsHtml}</div>
            `;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // 渲染歌词详情页
        function renderLyrics(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) {
                renderNotFound();
                return;
            }

            // 把歌词按行处理，空行保留为段落分隔
            const lyricsHtml = song.lyrics
                .split("\n")
                .map(line => {
                    const trimmed = line.trim();
                    if (trimmed === "") {
                        return `<div style="height:14px"></div>`;
                    }
                    return `<div class="lyric-line">${escapeHtml(trimmed)}</div>`;
                })
                .join("");

            app.innerHTML = `
                <section class="lyrics-page">
                    <button class="back-btn" onclick="goHome()">← 返回列表</button>
                    <div class="lyrics-header">
                        <div class="lyrics-cover" style="background: ${song.cover};">${song.char}</div>
                        <div class="lyrics-info">
                            <h2>${song.title}</h2>
                            <div class="artist">演唱：${song.artist}</div>
                            <div class="album">专辑：《${song.album}》 · ${song.year}</div>
                        </div>
                    </div>
                    <div class="lyrics-content">${lyricsHtml}</div>
                </section>
            `;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // 渲染关于页
        function renderAbout() {
            app.innerHTML = `
                <section class="lyrics-page">
                    <button class="back-btn" onclick="goHome()">← 返回首页</button>
                    <h2 class="section-title">关于歌词馆</h2>
                    <div class="lyrics-content">
歌词馆是一个纯前端实现的歌词收藏展示站点，使用原生 HTML / CSS / JavaScript 构建，无需任何构建工具或后端服务。

特点：
· 单页应用（SPA）哈希路由，点击卡片即可切换页面
· 响应式卡片网格，适配桌面与移动端
· 卡片悬停动效与渐变封面设计
· 收录 8 首经典华语歌曲完整歌词

本项目仅供学习交流使用，所有歌词版权归原作者及唱片公司所有。
                    </div>
                </section>
            `;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // 404
        function renderNotFound() {
            app.innerHTML = `
                <section class="lyrics-page">
                    <h2 class="section-title">页面未找到</h2>
                    <div class="lyrics-content">你访问的歌曲不存在，请返回首页重新选择。</div>
                    <button class="back-btn" onclick="goHome()" style="margin-top:20px">← 返回首页</button>
                </section>
            `;
        }

        // 简单的 HTML 转义，防止歌词里的特殊字符破坏结构
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // 返回首页
        function goHome() {
            location.hash = "#/";
        }

        // 路由分发
        function router() {
            const hash = location.hash.replace(/^#/, "") || "/";
            if (hash === "/" || hash === "") {
                renderHome();
            } else if (hash === "/about") {
                renderAbout();
            } else if (hash.startsWith("/song/")) {
                const id = hash.replace("/song/", "");
                renderLyrics(id);
            } else {
                renderNotFound();
            }
        }

        // 监听路由变化
        window.addEventListener("hashchange", router);
        // 初始加载
        window.addEventListener("DOMContentLoaded", router);
        // 若已加载完成
        if (document.readyState === "complete" || document.readyState === "interactive") {
            router();
        }
    </script>
</body>
</html>
